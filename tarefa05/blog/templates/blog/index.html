<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <title>Blog | {%block titulo%}Página Inicial{%endblock%}</title>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="{% url 'index' %}">Blog do Pedrão</a>
        </div>
    </nav>

   
    <main class="flex-grow-1 text-center">
        {%block main %}
        
        <h1>Últimas Notícias!</h1>
        <ul class="list-group">
            {%for post in posts%}
            <a class="text-dark text-decoration-none"  href="{% url 'post' post.id%}"><li class="list-group-item">{{post.titulo}} |</a> <small class="text-muted"> Publicado Em: {{post.data}}</small></li>
            {%endfor%}
        </ul> 
        {%endblock%}
    </main>
    
    <footer class="bg-primary text-white text-center py-2">
        <div class="container">
            <p class="mb-1">Desenvolvido por Pedro Emanuel Vitorino Dias Monteiro/InfoWeb3M</p>
            <small>&copy; 2026 Todos os direitos reservados.</small>
        </div>
    </footer>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
